<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f4ed"><meta name="description" content="光緣 GUANGYUAN｜5 題遇見你的靈魂香氣。透過直覺與香氣喜好探索當下的自己。"><title>光緣 GUANGYUAN｜靈魂香氣探索所</title>
<style>
:root{--ink:#36392f;--muted:#74766a;--olive:#858d70;--gold:#aa9770;--paper:#f7f4ed;--line:#e0dbcf;--white:#fffdf9}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:radial-gradient(ellipse at 12% 8%,#efe7d8 0%,transparent 40%),radial-gradient(ellipse at 90% 75%,#e9ece2,transparent 44%),var(--paper);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;min-height:100dvh}button,textarea,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #b2a36b;outline-offset:3px}.shell{max-width:600px;margin:auto;padding:22px 18px 64px}.top{display:flex;justify-content:space-between;align-items:center;padding:12px 0 28px;gap:12px}.logo{font-size:17px;letter-spacing:.25em;font-weight:500}.micro{font-size:10px;letter-spacing:.19em;color:var(--muted)}.top .micro{text-align:right}.panel{border:1px solid rgba(173,163,138,.4);border-radius:25px;background:rgba(255,253,249,.85);padding:34px 27px;box-shadow:0 18px 45px #655a4311;min-height:470px}.eyebrow{font-size:11px;letter-spacing:.27em;color:var(--gold);font-weight:600}.hero{text-align:center;padding-top:25px}.seal{height:83px;width:83px;border:1px solid var(--gold);border-radius:50%;margin:0 auto 29px;display:grid;place-content:center;color:var(--olive);font-size:35px;position:relative}.seal:after{content:"";position:absolute;inset:6px;border:1px solid #d5c7ab;border-radius:50%}h1,h2,h3,p{margin-top:0}h1,h2{font-family:"Noto Serif TC","Songti TC",serif;font-weight:500}h1{font-size:clamp(28px,7vw,42px);letter-spacing:.08em;line-height:1.45;margin:18px 0}h2{font-size:clamp(24px,6vw,32px);line-height:1.48;margin:16px 0 26px}h3{font-size:19px}.lede{font-size:14px;line-height:2.1;color:var(--muted);margin-bottom:26px}.btn{border:0;border-radius:99px;background:var(--ink);color:white;padding:15px 24px;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;font-size:14px;letter-spacing:.07em;transition:transform .16s,background .16s}.btn:hover{background:#59624d;transform:translateY(-1px)}.btn.wide{width:100%}.btn.secondary{color:var(--ink);background:transparent;border:1px solid var(--line)}.btn.secondary:hover{background:#f3efe5}.fine{font-size:11px;line-height:1.9;color:var(--muted)}.divider{height:1px;background:var(--line);margin:26px 0}.foot{text-align:center;margin-top:28px;font-size:11px;color:var(--muted);line-height:2}.progress-row{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.progress{height:4px;background:#e8e5dc;border-radius:10px;overflow:hidden;margin:12px 0 35px}.progress>div{height:100%;background:var(--olive);transition:width .25s}.question-sub{font-size:13px;color:var(--muted);line-height:1.8}.choices{display:grid;gap:12px;margin:28px 0 23px}.choice{display:flex;align-items:center;text-align:left;gap:15px;padding:16px 15px;border-radius:14px;background:#ffffff91;border:1px solid var(--line);color:var(--ink);font-size:14px;line-height:1.6;min-height:66px}.choice:hover,.choice:focus-visible{border-color:var(--olive);background:#f2f1e9}.letter{width:31px;height:31px;flex:0 0 31px;border-radius:50%;display:grid;place-items:center;background:#edeee8;color:var(--olive);font-size:12px}.actions{display:flex;gap:10px;align-items:center;justify-content:space-between}.back{border:0;background:transparent;color:var(--muted);padding:12px 0;font-size:13px}.result{text-align:center}.result-name{font-family:"Noto Serif TC","Songti TC",serif;font-size:39px;letter-spacing:.12em;line-height:1.4;margin:14px 0 8px}.eng{font-size:10px;letter-spacing:.22em;color:var(--gold);margin-bottom:25px}.quote{background:#eeede5;border-radius:14px;padding:21px;font-family:"Noto Serif TC","Songti TC",serif;line-height:1.9;font-size:17px;margin:25px 0}.result-copy{text-align:left;color:#62665b;line-height:2;font-size:14px}.notes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px}.note{border:1px solid var(--line);background:#fffdf9;border-radius:12px;padding:15px 8px;text-align:center;min-width:0}.note strong{display:block;margin-bottom:8px;font-size:12px;color:#93856b}.note span{font-size:13px;line-height:1.7}.field{text-align:left;margin:16px 0}.field label{display:block;font-size:13px;font-weight:600;margin-bottom:8px}.field input{width:100%;border-radius:10px;background:#fffefa;border:1px solid var(--line);padding:12px;font-size:14px;color:var(--ink)}.check{display:flex;align-items:start;gap:10px;text-align:left;font-size:13px;line-height:1.8;color:#666a5f;margin:18px 0}.check input{margin-top:5px;accent-color:var(--olive)}.notice{padding:15px;background:#f1f0e8;border-radius:12px;color:#65695b;font-size:12px;line-height:1.9;text-align:left;margin:22px 0}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#364033;color:white;border-radius:12px;padding:12px 17px;font-size:13px;z-index:3;box-shadow:0 8px 20px #2224}a{color:var(--olive)}.hidden{display:none!important}@media(max-width:430px){.shell{padding:14px 12px 42px}.panel{padding:27px 19px;border-radius:20px}.top{padding-bottom:20px}.notes{gap:6px}.note{padding:12px 5px}.result-name{font-size:34px}}
</style></head><body><main class="shell"><header class="top"><div><div class="logo">光緣</div><div class="micro">GUANGYUAN</div></div><div class="micro">SOUL AROMA<br>DISCOVERY</div></header><section class="panel" id="app" aria-live="polite"></section><footer class="foot">光緣 GUANGYUAN · 香氣是一場與自己的相遇<br>© <span id="year"></span> GUANGYUAN</footer></main>
<script>
/* 店主修改這一行：填入實際「光緣官方 LINE 加好友網址」，例如 https://lin.ee/xxxxxxxx */
const OFFICIAL_LINE_URL = "https://lin.ee/5aqffCi";
const questions=[
{title:"最近的你，內心最常出現哪一種聲音？",sub:"感受當下，不必思考太久。",options:[["我想安靜一下，讓思緒慢下來","calm"],["我想重新找回前進的勇氣","rise"],["我想被溫柔理解與擁抱","love"],["我想放下過去，重新開始","release"],["我想找回自信，閃閃發光","shine"]]},
{title:"此刻，你最渴望擁有什麼感受？",sub:"選一種最能代表現在的你的感受。",options:[["平靜與安定","calm"],["力量與新生","rise"],["被愛與接納","love"],["自由與輕盈","release"],["自信與喜悅","shine"]]},
{title:"憑直覺，你想走進哪個場景？",sub:"閉上眼想像：哪個地方最吸引你？",options:[["清晨安靜的森林","calm"],["迎接曙光的山頂","rise"],["盛開花朵的庭院","love"],["海風吹拂的遼闊海岸","release"],["陽光灑落的柑橘果園","shine"]]},
{title:"你最容易被哪種香氣吸引？",sub:"這題專門記錄你的嗅覺偏好。",options:[["草本清香・薰衣草般的柔和","herbal"],["溫暖木質・檀香與雪松般的沉穩","wood"],["柔美花香・天竺葵般的細緻","floral"],["森林清新・乾淨通透的氣息","fresh"],["明亮果香・甜橙般的愉悅","citrus"]]},
{title:"你希望這瓶香氣陪伴哪個時刻？",sub:"讓香氣與你的日常連結。",options:[["睡前，讓自己放慢腳步","calm"],["展開一天，迎接新挑戰","rise"],["獨處，好好愛自己的時候","love"],["轉換心情，整理思緒的時候","release"],["出門、工作或約會的時候","shine"]]}
];
const profiles={
calm:{name:"沉靜之境",eng:"SANCTUARY OF STILLNESS",quote:"無須追趕世界，你也可以慢慢盛開。",story:"你的心此刻渴望安靜的空間。你不必隨時堅強，也不必永遠跟上別人的步調。讓香氣成為提醒自己放慢腳步的日常儀式。",notes:["柔和草本","清雅薰衣草","乳香與雪松"],oils:"真正薰衣草、乳香、雪松"},
rise:{name:"破曉重生",eng:"AWAKENING LIGHT",quote:"每一次重新出發，都是靈魂的新篇章。",story:"你正在渴望新的可能。從明亮果香到溫暖木質，就像天光漸亮，陪伴你以自己的速度跨出下一步。",notes:["明亮甜橙","溫潤乳香","深邃檀香"],oils:"甜橙、乳香、檀香"},
love:{name:"柔光之擁",eng:"TENDER EMBRACE",quote:"當你願意愛自己，溫柔便有了歸處。",story:"你珍視理解與連結，也值得給自己多一點耐心。柔和花香與溫暖氣息交織，像一封寫給自己的信。",notes:["輕甜柑橘","柔美花香","溫暖乳香"],oils:"玫瑰天竺葵、甜橙、乳香"},
release:{name:"自由之息",eng:"BREATH OF FREEDOM",quote:"放下不再屬於你的，迎接真正的自己。",story:"你想為心靈與生活留下新的空間。清新綠意配上乾淨木香，描繪一種像海風般自由的感覺。",notes:["清爽柑橘","青綠絲柏","乾淨雪松"],oils:"甜橙、絲柏、雪松"},
shine:{name:"向光而生",eng:"BLOOM IN LIGHT",quote:"你本來就有光，不需要任何人定義。",story:"你期待更自在地展現真實的自己。活潑柑橘、細緻花香與溫柔木質，勾勒屬於你的明亮日常。",notes:["鮮活血橙","明媚花香","柔和檀香"],oils:"血橙、玫瑰天竺葵、檀香"}
};
const labels={herbal:"草本清香",wood:"溫暖木質",floral:"柔美花香",fresh:"森林清新",citrus:"明亮果香"};
const types=["calm","rise","love","release","shine"];
let page="intro",step=0,answers=[],avoid="",sensitive=false;
const app=document.getElementById("app");document.getElementById("year").textContent=new Date().getFullYear();
function winner(){const scores=Object.fromEntries(types.map(x=>[x,0]));[0,1,2,4].forEach(i=>{if(answers[i])scores[answers[i]]++});return types.reduce((a,b)=>scores[b]>scores[a]?b:a,"calm");} // 同分採固定順序：安定、重生、溫柔、釋放、自信
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function render(){window.scrollTo({top:0,behavior:"instant"});if(page==="intro"){app.innerHTML=`<div class="hero"><div class="seal" aria-hidden="true">❀</div><div class="eyebrow">GUANGYUAN · SOUL AROMA</div><h1>遇見你的<br>靈魂香氣</h1><p class="lede">氣味，或許是通往內在的一條路。<br>透過 5 道直覺選擇題，<br>探索此刻最貼近自己的香氣。</p><button class="btn wide" id="start">開始探索 →</button><div class="divider"></div><p class="fine">約 1–2 分鐘 · 免費探索 · 不需登入<br>這是感受與香氣偏好的互動體驗，並非心理或醫療診斷。</p></div>`;document.getElementById("start").onclick=()=>{page="quiz";render()};return;}
if(page==="quiz"){const q=questions[step];app.innerHTML=`<div class="progress-row"><span>內在探索 · 第 ${step+1} / 5 題</span><span>${step*20}%</span></div><div class="progress"><div style="width:${step*20}%"></div></div><div class="eyebrow">LISTEN TO YOURSELF</div><h2>${q.title}</h2><p class="question-sub">${q.sub}</p><div class="choices">${q.options.map(([label],i)=>`<button class="choice" data-choice="${i}"><span class="letter">${"ABCDE"[i]}</span><span>${label}</span></button>`).join("")}</div><div class="actions"><button class="back" id="back">← ${step===0?"返回首頁":"上一題"}</button><span class="fine">相信你的第一個直覺</span></div>`;document.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>{answers[step]=q.options[+b.dataset.choice][1];if(step===4){page="result"}else step++;render()});document.getElementById("back").onclick=()=>{if(step===0)page="intro";else step--;render()};return;}
const p=profiles[winner()], pref=labels[answers[3]];app.innerHTML=`<div class="result"><div class="seal" aria-hidden="true">✧</div><div class="eyebrow">YOUR SOUL AROMA</div><p class="question-sub">你的靈魂香氣原型</p><div class="result-name">${p.name}</div><div class="eng">${p.eng}</div><div class="quote">「${p.quote}」</div><p class="result-copy">${p.story}</p><div class="divider"></div><h3>你的香氣輪廓</h3><p class="fine">你偏好的氣味：${pref}</p><div class="notes">${["前調","中調","後調"].map((x,i)=>`<div class="note"><strong>${x}</strong><span>${p.notes[i]}</span></div>`).join("")}</div><div class="notice"><strong>建議香材方向：</strong>${p.oils}<br>這是香氣故事與初步搭配概念，實際比例、可用濃度及香材替換須由調香師再確認；測驗結果不代表精油療效。</div><div class="divider"></div><h3>讓光緣替你完成這份香氣</h3><p class="result-copy">如果你喜歡這個方向，可以把結果帶到光緣官方 LINE，進一步聊聊適合你的 10ml 客製靈魂調香。</p><div class="field"><label for="avoid">不喜歡或想避開的氣味（選填）</label><input id="avoid" maxlength="120" placeholder="例如：玫瑰、薄荷、太甜的味道" value="${esc(avoid)}"></div><label class="check"><input type="checkbox" id="sensitive" ${sensitive?"checked":""}><span>我有孕期、哺乳期、過敏史、特殊健康狀況，或希望用於兒童，需要調香前進一步確認</span></label><button class="btn wide" id="copy">① 複製我的香氣諮詢單</button><div style="height:11px"></div><button class="btn wide secondary" id="line">② 前往光緣官方 LINE →</button><div style="height:12px"></div><button class="back" id="restart">↻ 重新探索</button><p class="fine">結果不會自動傳送給光緣。請先複製諮詢單，再進入 LINE 貼上送出。若對香料過敏或有特殊情況，請於調製前告知。</p></div>`;
document.getElementById("avoid").oninput=e=>avoid=e.target.value;document.getElementById("sensitive").onchange=e=>sensitive=e.target.checked;document.getElementById("copy").onclick=copy;document.getElementById("line").onclick=()=>{if(!/^https:\/\/(lin\.ee|line\.me|page\.line\.me)\//i.test(OFFICIAL_LINE_URL)){toast("尚未設定官方 LINE 網址；請店主先完成設定");return;}window.open(OFFICIAL_LINE_URL,"_blank","noopener,noreferrer")};document.getElementById("restart").onclick=()=>{answers=[];avoid="";sensitive=false;step=0;page="intro";render()};}
function summary(){const p=profiles[winner()];return `【光緣 GUANGYUAN｜靈魂香氣探索】\n我的香氣原型：${p.name}\n偏好氣味：${labels[answers[3]]}\n建議香材：${p.oils}\n希望避開：${avoid.trim()||"未填寫"}\n需事先評估的狀況：${sensitive?"有，請進一步詢問":"未勾選（仍須於調製前確認）"}\n\n您好，我想諮詢 10ml 客製靈魂調香。`}
async function copy(){try{await navigator.clipboard.writeText(summary());toast("已複製！前往 LINE 貼上即可諮詢") }catch(e){const t=document.createElement("textarea");t.value=summary();document.body.appendChild(t);t.select();let ok=document.execCommand("copy");t.remove();toast(ok?"已複製諮詢單":"無法自動複製，請改用瀏覽器分享功能")}}
function toast(msg){document.querySelector(".toast")?.remove();let x=document.createElement("div");x.className="toast";x.role="status";x.textContent=msg;document.body.append(x);setTimeout(()=>x.remove(),3200)}render();
</script></body></html>
