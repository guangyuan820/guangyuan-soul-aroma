<style>

acing:.07em;transition:transform .16s,background .16s}.btn:hover{background:#59624d;transform:translateY(-1px)}.btn.wide{width:100%}.btn.secondary{color:var(--ink);background:transparent;border:1px solid var(--line)}.btn.secondary:hover{background:#f3efe5}.fine{font-size:11px;line-height:1.9;color:var(--muted)}.divider{height:1px;background:var(--line);margin:26px 0}.foot{text-align:center;margin-top:28px;font-size:11px;color:var(--muted);line-height:2}.progress-row{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.progress{height:4px;background:#e8e5dc;border-radius:10px;overflow:hidden;margin:12px 0 35px}.progress>div{height:100%;background:var(--olive);transition:width .25s}.question-sub{font-size:13px;color:var(--muted);line-height:1.8}.choices{display:grid;gap:12px;margin:28px 0 23px}.choice{display:flex;align-items:center;text-align:left;gap:15px;padding:16px 15px;border-radius:14px;background:#ffffff91;border:1px solid var(--line);color:var(--ink);font-size:14px;line-height:1.6;min-height:66px}.choice:hover,.choice:focus-visible{border-color:var(--olive);background:#f2f1e9}.letter{width:31px;height:31px;flex:0 0 31px;border-radius:50%;display:grid;place-items:center;background:#edeee8;color:var(--olive);font-size:12px}.actions{display:flex;gap:10px;align-items:center;justify-content:space-between}.back{border:0;background:transparent;color:var(--muted);padding:12px 0;font-size:13px}.result{text-align:center}.result-name{font-family:"Noto Serif TC","Songti TC",serif;font-size:39px;letter-spacing:.12em;line-height:1.4;margin:14px 0 8px}.eng{font-size:10px;letter-spacing:.22em;color:var(--gold);margin-bottom:25px}.quote{background:#eeede5;border-radius:14px;padding:21px;font-family:"Noto Serif TC","Songti TC",serif;line-height:1.9;font-size:17px;margin:25px 0}.result-copy{text-align:left;color:#62665b;line-height:2;font-size:14px}.notes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px}.note{border:1px solid var(- const questions=[

calm:{name:"沉靜之境",eng:"SANCTUARY OF STILLNESS",quote:"無須追趕世界，你也可以慢慢盛開。",story:"你的心此刻渴望安靜的空間。你不必隨時堅強，也不必永遠跟上別人的步調。讓香氣成為提醒自己放慢腳步的日常儀式。",notes:["柔和草本","清雅薰衣草","乳香與雪松"],oils:"真正薰衣草、乳香、雪松"},
rise:{name:"破曉重生",eng:"AWAKENING LIGHT",quote:"每一次重新出發，都是靈魂的新篇章。",story:"你正在渴望新的可能。從明亮果香到溫暖木質，就像天光漸亮，陪伴你以自己的速度跨出下一步。",notes:["明亮甜橙","溫潤乳香","深邃檀香"],oils:"甜橙、乳香、檀香"},
love:{name:"柔光之擁",eng:"TENDER EMBRACE",quote:"當你願意愛自己，溫柔便有了歸處。",story:"你珍視理解與連結，也值得給自己多一點耐心。柔和花香與溫暖氣息交織，像一封寫給自己的信。",notes:["輕甜柑橘","柔美花香","溫暖乳香"],oils:"玫瑰天竺葵、甜橙、乳香"},

shine:{name:"向光而生",eng:"BLOOM IN LIGHT",quote:"你本來就有光，不需要任何人定義。",story:"你期待更自在地展現真實的自己。活潑柑橘、細緻花香與溫柔木質，勾勒屬於你的明亮日常。",notes:["鮮活血橙","明媚花香","柔和檀香"],oils:"血橙、玫瑰天竺葵、檀香"}
};

let sessionRecorded=false;
const app=document.getElementById("app");document.getElementById("year").textContent=new Date().getFullYear();
function winner(){const scores=Object.fromEntries(types.map(x=>[x,0]));[0,1,2,4].forEach(i=>{if(answers[i])scores[answers[i]]++});return types.reduce((a,b)=>scores[b]>scores[a]?b:a,"calm");} // 同分採固定順序：安定、重生、溫柔、釋放、自信
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function render(){window.scrollTo({top:0,behavior:"instant"});if(page==="intro"){app.innerHTML=`<div class="hero"><div class="seal" aria-hidden="true">❀</div><div class="eyebrow">GUANGYUAN · SOUL AROMA</div><h1>遇見你的<br>靈魂香氣</h1><p class="lede">氣味，或許是通往內在的一條路。<br>透過 5 道直覺選擇題，<br>探索此刻最貼近自己的香氣。</p><button class="btn wide" id="start">開始探索 →</button><div class="divider"></div><p class="fine">約 1–2 分鐘 · 免費探索 · 不需登入<br>這是感受與香氣偏好的互動體驗，並非心理或醫療診斷。</p></div>`;document.getElementById("start").onclick=()=>{page="quiz";render()};return;}
if(page==="quiz"){const q=questions[step];app.innerHTML=`<div class="progress-row"><span>內在探索 · 第 ${step+1} / 5 題</span><span>${step*20}%</span></div><div class="progress"><div style="width:${step*20}%"></div></div><div class="eyebrow">LISTEN TO YOURSELF</div><h2>${q.title}</h2><p class="question-sub">${q.sub}</p><div class="choices">${q.options.map(([label],i)=>`<button class="choice" data-choice="${i}"><span class="letter">${"ABCDE"[i]}</span><span>${label}</span></button>`).join("")}</div><div class="actions"><button class="back" id="back">← ${step===0?"返回首頁":"上一題"}</button><span class="fine">相信你的第一個直覺</span></div>`;document.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>{answers[step]=q.options[+b.dataset.choice][1];if(step===4){page="result";recordEvent("quiz_complete");}else step++;render()});document.getElementById("back").onclick=()=>{if(step===0)page="intro";else step--;render()};return;}
const p=profiles[winner()], pref=labels[answers[3]];app.innerHTML=`<div class="result"><div class="seal" aria-hidden="true">✧</div><div class="eyebrow">YOUR SOUL AROMA</div><p class="question-sub">你的靈魂香氣原型</p><div class="result-name">${p.name}</div><div class="eng">${p.eng}</div><div class="quote">「${p.quote}」</div><p class="result-copy">${p.story}</p><div class="divider"></div><h3>你的香氣輪廓</h3><p class="fine">你偏好的氣味：${pref}</p><div class="notes">${["前調","中調","後調"].map((x,i)=>`<div class="note"><strong>${x}</strong><span>${p.notes[i]}</span></div>`).join("")}</div><div class="notice"><strong>建議香材方向：</strong>${p.oils}<br>這是香氣故事與初步搭配概念，實際比例、可用濃度及香材替換須由調香師再確認；測驗結果不代表精油療效。</div><div class="divider"></div><h3>我的香氣分享卡</h3><p class="result-copy">把這份香氣故事存成 IG 限時動態圖片，邀請朋友探索自己的香氣。</p><button class="btn wide" id="downloadCard">↓ 儲存 9:16 專屬香氣圖卡</button><div style="height:10px"></div><button class="btn wide secondary" id="shareCard">分享我的香氣卡</button><div class="divider"></div><h3>讓光緣替你完成這份香氣</h3><p class="result-copy">如果你喜歡這個方向，可以把結果帶到光緣官方 LINE，進一步聊聊適合你的 10ml 客製靈魂調香。</p><div class="notice"><strong>進階客製調香諮詢</strong><br>以下資料只會在你主動複製、傳送給官方 LINE 時交給調香師；網站不會將這些個人填答送進統計資料表。</div>

<div class="field"><label for="dislikes">不喜歡或想避開的氣味（選填）</label><input id="dislikes" maxlength="120" placeholder="例如：玫瑰、薄荷、太甜的味道" value="${esc(consultation.dislikes)}"></div>
<div class="field"><label for="allergy">香料過敏或其他需要留意的情況（選填）</label><textarea id="allergy" maxlength="250" rows="3" placeholder="例如：曾經對特定精油有反應；詳細敏感資訊可到 LINE 私下說明">${esc(consultation.allergy)}</textarea></div>
<div class="field"><label for="note">想對靈魂調香師說的話（選填）</label><textarea id="note" maxlength="240" rows="3" placeholder="期待的感受、想送給誰、喜歡的氣味故事…">${esc(consultation.note)}</textarea></div><label class="check"><input type="checkbox" id="sensitive" ${sensitive?"checked":""}><span>我有孕期、哺乳期、過敏史、特殊健康狀況，或希望用於兒童，需要調香前進一步確認</span></label><button class="btn wide" id="copy">① 複製我的香氣諮詢單</button><div style="height:11px"></div><button class="btn wide secondary" id="line">② 前往光緣官方 LINE →</button><div style="height:12px"></div><button class="back" id="restart">↻ 重新探索</button><p class="fine">結果不會自動傳送給光緣。請先複製諮詢單，再進入 LINE 貼上送出。若對香料過敏或有特殊情況，請於調製前告知。</p></div>`;
document.getElementById("downloadCard").onclick=()=>makeCard(false);
document.getElementById("shareCard").onclick=()=>makeCard(true);
["use","age","strength","dislikes","allergy","note"].forEach(id=>{const el=document.getElementById(id);el.value=consultation[id];el.addEventListener("input",()=>consultation[id]=el.value)});
document.getElementById("sensitive").onchange=e=>sensitive=e.target.checked;document.getElementById("copy").onclick=copy;document.getElementById("line").onclick=()=>{if(!/^https:\/\/(lin\.ee|line\.me|page\.line\.me)\//i.test(OFFICIAL_LINE_URL)){toast("尚未設定官方 LINE 網址；請店主先完成設定");return;}recordEvent("line_click");window.open(OFFICIAL_LINE_URL,"_blank","noopener,noreferrer")};document.getElementById("restart").onclick=()=>{answers=[];avoid="";sensitive=false;consultation={use:"rollon",age:"adult",strength:"soft",experience:"first",dislikes:"",allergy:"",note:"",consent:false};step=0;page="intro";render()};}
function summary(){const p=profiles[winner()];return `【光緣 GUANGYUAN｜靈魂香氣探索】\n我的香氣原型：${p.name}\n偏好氣味：${labels[answers[3]]}\n建議香材：${p.oils}\n希望避開：${consultation.dislikes.trim()||"未填寫"}\n使用方式：${{rollon:"肌膚滾珠",perfume:"個人香氣",room:"空間香氛",unknown:"尚未確定"}[consultation.use]}\n使用者：${{adult:"一般成人",minor:"未成年",senior:"年長者",unknown:"其他"}[consultation.age]}\n濃淡喜好：${{soft:"清淡柔和",medium:"適中自然",rich:"明顯濃郁"}[consultation.strength]}\n特殊留意：${consultation.allergy.trim()||"未填寫（請調香前再確認）"}\n其他期待：${consultation.note.trim()||"無"}\n需事先評估的狀況：${sensitive?"有，請進一步詢問":"未勾選（仍須於調製前確認）"}\n\n您好，我想諮詢 10ml 客製靈魂調香。`}
async function copy(){try{await navigator.clipboard.writeText(summary());toast("已複製！前往 LINE 貼上即可諮詢") }catch(e){const t=document.createElement("textarea");t.value=summary();document.body.appendChild(t);t.select();let ok=document.execCommand("copy");t.remove();toast(ok?"已複製諮詢單":"無法自動複製，請改用瀏覽器分享功能")}}
// 匿名事件統計：預設僅本裝置，設定試算表端點後才會集中記錄。絕不傳送個人問卷備註。
function recordEvent(event){
  const type=event==="quiz_complete"||event==="line_click"?event:null;
  if(!type)return;
  const data={event:type,profile:profiles[winner()]?.name||"",scent:labels[answers[3]]||"",version:"2.0"};
  try{const key="gy_stats_v2",stats=JSON.parse(localStorage.getItem(key)||"{}");stats[type]=(stats[type]||0)+1;localStorage.setItem(key,JSON.stringify(stats));}catch(e){}
  if(!/^https:\/\/script\.google\.com\/macros\/s\//.test(ANALYTICS_ENDPOINT))return;
  try{fetch(ANALYTICS_ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams(data),keepalive:true}).catch(()=>{});}catch(e){}
}
function cardCanvas(){
  const cv=document.createElement("canvas");cv.width=1080;cv.height=1920;const c=cv.getContext("2d"),p=profiles[winner()];
